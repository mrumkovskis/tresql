name: Build and test
on:   [push]
jobs:
  Build-and-test:
    runs-on:  ${{ matrix.os }}
    strategy:
      matrix:
        os:   [ubuntu-22.04]  # TODO macos-latest, windows-latest
        java: [11] #, 17, 21]
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB:                tresql
          POSTGRES_PASSWORD:          tresql
          POSTGRES_USER:              tresql
          POSTGRES_HOST_AUTH_METHOD:  trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v2
      with:
        java-version: ${{ matrix.java }}
        distribution: 'adopt'
    - name: Setup Mill
      run: |
        curl -L https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/$(cat .mill-version)/mill-dist-$(cat .mill-version)-mill.sh -o mill
        chmod +x mill
    - name: Compile
      run:  ./mill __.compile
    - name: Test
      run:  ./mill 'tresql[_].test'
    - name: Integration test
      run:  ./mill 'it[_].test'
