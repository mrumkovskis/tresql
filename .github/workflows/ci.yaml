name: Build and test
on:   [push]
jobs:
  Build-and-test:
    runs-on:  ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:     [ubuntu-24.04]  # TODO macos-latest, windows-latest
        java:   [11] #, 17, 21]
        scala:  ["2.12.21", "2.13.18", "3.3.9"]
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB:                tresql
          POSTGRES_PASSWORD:          tresql
          POSTGRES_USER:              tresql
          POSTGRES_HOST_AUTH_METHOD:  trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
        cache: sbt
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
      with:
        sbt-runner-version: 1.13.1
    - name: Compile and test
      run: >
        sbt -J-Xmx8G
        "++${{ matrix.scala }}"
        clean update compile
        test it/test
